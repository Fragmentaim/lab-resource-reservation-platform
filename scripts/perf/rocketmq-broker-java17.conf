[Service]
# RocketMQ 4.x 在 Java 17 下读取历史 mmap 文件需要开放 NIO 内部模块。
# 同时覆盖安装包默认的 15G DirectMemory，适配本次 4C8G 压测机。
Environment="JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"
Environment="JAVA_OPT_EXT=--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED -XX:MaxDirectMemorySize=1g"
