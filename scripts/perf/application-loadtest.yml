# 4C8G ECS 上的隔离压测配置。数据库固定为 lab_booking_loadtest。
server:
  port: ${LOADTEST_SERVER_PORT:8082}
  tomcat:
    threads:
      max: ${LOADTEST_TOMCAT_MAX_THREADS:64}
      min-spare: ${LOADTEST_TOMCAT_MIN_SPARE_THREADS:16}
    accept-count: ${LOADTEST_TOMCAT_ACCEPT_COUNT:250}
    max-connections: ${LOADTEST_TOMCAT_MAX_CONNECTIONS:1000}

spring:
  cloud:
    stream:
      rocketmq:
        binder:
          name-server: ${LOADTEST_MQ_NAMESERVER:127.0.0.1:9876}
      bindings:
        reservationDelayConsumer-in-0:
          consumer:
            auto-startup: false
        adminAuditConsumer-in-0:
          consumer:
            auto-startup: false
        documentProcessConsumer-in-0:
          consumer:
            auto-startup: false
  datasource:
    url: ${LOADTEST_DB_URL:jdbc:mysql://127.0.0.1:3306/lab_booking_loadtest?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8}
    username: ${LOADTEST_DB_USERNAME:root}
    password: ${LOADTEST_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${LOADTEST_DB_POOL_MAX_SIZE:32}
      minimum-idle: ${LOADTEST_DB_POOL_MIN_IDLE:16}
      connection-timeout: ${LOADTEST_DB_CONNECTION_TIMEOUT_MILLIS:10000}
      validation-timeout: ${LOADTEST_DB_VALIDATION_TIMEOUT_MILLIS:3000}
  data:
    redis:
      host: ${LOADTEST_REDIS_HOST:127.0.0.1}
      port: ${LOADTEST_REDIS_PORT:6379}
      database: ${LOADTEST_REDIS_DATABASE:15}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  reservation:
    hot-redis-enabled: ${LOADTEST_OPTIMIZED_ENABLED:true}
    command:
      enabled: ${LOADTEST_OPTIMIZED_ENABLED:true}
      consumer-enabled: ${LOADTEST_OPTIMIZED_ENABLED:true}
      topic: ${LOADTEST_MQ_TOPIC:reservation-command-loadtest}
      result-topic: ${LOADTEST_RESULT_TOPIC:reservation-result-loadtest}
      producer-group: ${LOADTEST_MQ_PRODUCER_GROUP:reservation-command-loadtest-producer}
      consumer-group: ${LOADTEST_MQ_CONSUMER_GROUP:reservation-confirm-loadtest-group}
      result-consumer-group: ${LOADTEST_RESULT_CONSUMER_GROUP:reservation-result-loadtest-group}
      consumer-concurrency: ${LOADTEST_MQ_CONSUMER_CONCURRENCY:4}
      result-consumer-concurrency: ${LOADTEST_RESULT_CONSUMER_CONCURRENCY:2}
    rate-limit:
      enabled: false
    reminder:
      enabled: false
    auto-cancel:
      enabled: false
  message-outbox:
    enabled: ${LOADTEST_OPTIMIZED_ENABLED:true}
    producer-group: ${LOADTEST_OUTBOX_PRODUCER_GROUP:lab-booking-loadtest-outbox-producer}
    delay-topic: ${LOADTEST_DELAY_TOPIC:reservation-delay-loadtest}
    delay-consumer-group: ${LOADTEST_DELAY_CONSUMER_GROUP:reservation-delay-loadtest-group}
    outbox:
      dispatch-delay-millis: ${LOADTEST_OUTBOX_DISPATCH_DELAY_MILLIS:100}
      batch-size: ${LOADTEST_OUTBOX_BATCH_SIZE:100}
  audit:
    enabled: false
    mq:
      enabled: false
  knowledge:
    document-processing:
      enabled: false
