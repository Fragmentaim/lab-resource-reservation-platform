# Isolated profile for the HOT-reservation load test. Never point it at the
# normal lab_booking database: the initialization script rebuilds this schema.
server:
  port: ${LOADTEST_SERVER_PORT:8082}

spring:
  datasource:
    url: ${LOADTEST_DB_URL:jdbc:mysql://127.0.0.1:3306/lab_booking_loadtest?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8}
    username: ${LOADTEST_DB_USERNAME:root}
    password: ${LOADTEST_DB_PASSWORD:}
  data:
    redis:
      host: ${LOADTEST_REDIS_HOST:127.0.0.1}
      port: ${LOADTEST_REDIS_PORT:6379}
      database: ${LOADTEST_REDIS_DATABASE:15}

mybatis-plus:
  configuration:
    # Console SQL logging substantially distorts a burst benchmark.
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  reservation:
    submit-guard-enabled: true
    submit-guard-ttl-seconds: ${LOADTEST_SUBMIT_GUARD_TTL_SECONDS:5}
    hot-redis-enabled: true
    hot-init-wait-millis: 1000
    async:
      # Turn this on only after the dedicated RocketMQ NameServer/broker is ready.
      enabled: ${LOADTEST_MQ_ENABLED:false}
      name-server: ${LOADTEST_MQ_NAMESERVER:127.0.0.1:9876}
      topic: ${LOADTEST_MQ_TOPIC:reservation-create-loadtest}
      consumer-group: ${LOADTEST_MQ_CONSUMER_GROUP:lab-booking-reservation-loadtest-consumer}
      timeout-scan-fallback-enabled: true
    rate-limit:
      # The stock-correctness run uses one request per user. Enable this in the
      # dedicated rate-limit scenario instead of contaminating the burst result.
      enabled: ${LOADTEST_RATE_LIMIT_ENABLED:false}
      normal-max-requests: ${LOADTEST_NORMAL_MAX_REQUESTS:1000}
      normal-window-seconds: ${LOADTEST_NORMAL_WINDOW_SECONDS:10}
      hot-max-requests: ${LOADTEST_HOT_MAX_REQUESTS:1000}
      hot-window-seconds: ${LOADTEST_HOT_WINDOW_SECONDS:10}
  message-outbox:
    enabled: ${LOADTEST_MQ_ENABLED:false}
    name-server: ${LOADTEST_MQ_NAMESERVER:127.0.0.1:9876}
    producer-group: ${LOADTEST_MQ_PRODUCER_GROUP:lab-booking-loadtest-outbox-producer}
    delay-topic: ${LOADTEST_DELAY_TOPIC:reservation-delay-loadtest}
    delay-consumer-group: ${LOADTEST_DELAY_CONSUMER_GROUP:lab-booking-loadtest-delay-consumer}
  audit:
    # Admin-operation audit is unrelated to the request path under test.
    enabled: false
