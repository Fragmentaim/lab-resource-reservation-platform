server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/lab_booking?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
  cloud:
    function:
      definition: reservationDelayConsumer;adminAuditConsumer;reservationCommandConsumer;reservationResultConsumer
    stream:
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_NAMESERVER:127.0.0.1:9876}
        bindings:
          reservationDelayConsumer-in-0:
            consumer:
              subscription: '*'
              push:
                max-reconsume-times: ${app.message-outbox.max-reconsume-times:-1}
          adminAuditConsumer-in-0:
            consumer:
              subscription: admin-audit
              push:
                max-reconsume-times: ${app.audit.mq.max-reconsume-times:-1}
          reservationCommandConsumer-in-0:
            consumer:
              subscription: CREATE
              message-model: CLUSTERING
              push:
                max-reconsume-times: ${app.reservation.command.max-reconsume-times:16}
          reservationResultConsumer-in-0:
            consumer:
              subscription: RESULT
              message-model: CLUSTERING
              push:
                max-reconsume-times: ${app.reservation.command.max-reconsume-times:16}
          reservationDelay-out-0:
            producer:
              group: ${app.message-outbox.producer-group:lab-booking-outbox-producer-group}
          adminAudit-out-0:
            producer:
              group: ${app.message-outbox.producer-group:lab-booking-outbox-producer-group}
          reservationCommand-out-0:
            producer:
              group: ${app.reservation.command.producer-group:reservation-command-producer-group}
              producer-type: Trans
              transaction-listener: reservationTransactionListener
              send-type: Sync
              send-msg-timeout: ${app.reservation.command.send-timeout-millis:3000}
              retry-times-when-send-failed: ${app.reservation.command.send-retry-times:2}
          reservationResult-out-0:
            producer:
              group: ${app.message-outbox.producer-group:lab-booking-outbox-producer-group}
      bindings:
        reservationDelayConsumer-in-0:
          destination: ${app.message-outbox.delay-topic:reservation-delay}
          group: ${app.message-outbox.delay-consumer-group:reservation-delay-consumer-group}
          content-type: application/json
          consumer:
            auto-startup: ${app.message-outbox.enabled:false}
        adminAuditConsumer-in-0:
          destination: ${app.audit.mq.topic:admin-audit-log}
          group: ${app.audit.mq.consumer-group:admin-audit-consumer-group}
          content-type: application/json
          consumer:
            auto-startup: ${app.audit.mq.enabled:false}
        reservationCommandConsumer-in-0:
          destination: ${app.reservation.command.topic:reservation-command}
          group: ${app.reservation.command.consumer-group:reservation-confirm-group}
          content-type: application/json
          consumer:
            auto-startup: ${app.reservation.command.consumer-enabled:${app.reservation.command.enabled:false}}
            concurrency: ${app.reservation.command.consumer-concurrency:4}
        reservationResultConsumer-in-0:
          destination: ${app.reservation.command.result-topic:reservation-result}
          group: ${app.reservation.command.result-consumer-group:reservation-result-group}
          content-type: application/json
          consumer:
            auto-startup: ${app.reservation.command.enabled:false}
            concurrency: ${app.reservation.command.result-consumer-concurrency:2}
        reservationDelay-out-0:
          destination: ${app.message-outbox.delay-topic:reservation-delay}
          content-type: application/json
        adminAudit-out-0:
          destination: ${app.audit.mq.topic:admin-audit-log}
          content-type: application/json
        reservationCommand-out-0:
          destination: ${app.reservation.command.topic:reservation-command}
          content-type: application/json
        reservationResult-out-0:
          destination: ${app.reservation.command.result-topic:reservation-result}
          content-type: application/json

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production}
    expire-hours: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  reservation:
    hot-redis-enabled: false
    hot-cache-retention-hours: 24
    hot-request-retention-hours: 24
    command:
      enabled: false
      consumer-enabled: false
      topic: reservation-command
      result-topic: reservation-result
      producer-group: reservation-command-producer-group
      consumer-group: reservation-confirm-group
      result-consumer-group: reservation-result-group
      send-timeout-millis: 3000
      send-retry-times: 2
      max-reconsume-times: 16
      consumer-concurrency: 4
      result-consumer-concurrency: 2
    rate-limit:
      enabled: false
      normal-max-requests: 5
      normal-window-seconds: 10
      hot-max-requests: 3
      hot-window-seconds: 10
    reminder:
      enabled: true
      before-start-minutes: 10
    auto-cancel:
      enabled: true
      grace-minutes: 15
      check-in-before-start-minutes: 30
  message-outbox:
    enabled: false
    producer-group: lab-booking-outbox-producer-group
    max-reconsume-times: -1
    lock-seconds: 60
    delay-topic: reservation-delay
    delay-consumer-group: reservation-delay-consumer-group
    outbox:
      dispatch-delay-millis: 1000
      batch-size: 20
      max-retry-count: 10
      initial-retry-delay-millis: 1000
      max-retry-delay-millis: 300000
  audit:
    enabled: true
    mq:
      enabled: false
      topic: admin-audit-log
      consumer-group: admin-audit-consumer-group
      max-reconsume-times: -1
  resource-cache:
    enabled: ${RESOURCE_CACHE_ENABLED:false}
    ttl-seconds: ${RESOURCE_CACHE_TTL_SECONDS:300}
    double-delete-delay-millis: ${RESOURCE_CACHE_DOUBLE_DELETE_DELAY_MILLIS:500}
