<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约系统 ER 图高清交互式查看器</title>
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --btn-bg: #1e293b;
      --btn-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 */
    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title-area h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .title-area p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* 主体布局 */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 左侧控制栏 */
    .sidebar {
      width: 340px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 5;
      overflow-y: auto;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    /* 选项卡按钮 */
    .tab-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tab-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tab-btn:hover {
      background: var(--btn-hover);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .tab-btn.active {
      background: var(--accent-glow);
      color: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
    }

    .tab-btn span.description {
      font-size: 11px;
      opacity: 0.8;
      font-weight: 400;
    }

    /* 操作按钮 */
    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      grid-column: span 2;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* 说明面板 */
    .instruction-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .instruction-card ul {
      margin-left: 18px;
      margin-top: 8px;
    }

    /* 画布区域 */
    .canvas-container {
      flex: 1;
      position: relative;
      background-color: #0b0f19;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0),
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      overflow: hidden;
      cursor: grab;
    }

    .canvas-container:active {
      cursor: grabbing;
    }

    #diagram-wrapper {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.05s linear;
    }

    /* 自定义渲染后的 Mermaid 样式，使其在暗色背景下非常高级 */
    .mermaid {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .mermaid.ready {
      opacity: 1;
    }

    /* 浮动缩放显示 */
    .zoom-badge {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    /* 加载动画 */
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(56, 189, 248, 0.1);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  
  <!-- 引入 Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>预约系统 ER 图高清查看器</h1>
      <p>解决大图挤压、拥挤问题 · 支持无限画布缩放与大图导出</p>
    </div>
    <div style="font-size: 13px; color: var(--text-secondary)">
      D:\_Projects\01_Java\lab-booking-course\docs
    </div>
  </header>

  <div class="main-container">
    <!-- 左侧控制栏 -->
    <div class="sidebar">
      <div>
        <div class="section-title">选择视图模型</div>
        <div class="tab-group">
          <button class="tab-btn active" onclick="switchTab('core-chen')">
            <strong>核心预约链路 (陈氏模型)</strong>
            <span class="description">椭圆/矩形分组优化，适合汇报演示</span>
          </button>
          <button class="tab-btn" onclick="switchTab('core-crows')">
            <strong>核心预约链路 (Crow's Foot)</strong>
            <span class="description">最清晰，无属性泡泡，实体间关系</span>
          </button>
          <button class="tab-btn" onclick="switchTab('full-crows')">
            <strong>全量预约系统 (Crow's Foot)</strong>
            <span class="description">包含消息队列 Outbox、提醒与通知</span>
          </button>
        </div>
      </div>

      <div>
        <div class="section-title">画布操作</div>
        <div class="action-group">
          <button class="btn" onclick="zoomIn()">🔍 放大</button>
          <button class="btn" onclick="zoomOut()">🔍 缩小</button>
          <button class="btn" onclick="resetZoom()">🔄 重置</button>
          <button class="btn" onclick="exportSVG()">💾 导出 SVG</button>
          <button class="btn btn-primary" onclick="exportPNG()">🖼️ 导出超清 PNG 图片</button>
        </div>
      </div>

      <div class="instruction-card">
        <strong>💡 交互技巧：</strong>
        <ul>
          <li><b>缩放：</b>在右侧画布上滑动<b>鼠标滚轮</b>可无限放大/缩小。</li>
          <li><b>平移：</b>在画布上<b>按住左键拖拽</b>可任意平移图像。</li>
          <li><b>导出：</b>点击“导出超清 PNG”可自动生成无损、超大分辨率的图片用于 PPT 或文档。</li>
        </ul>
      </div>
    </div>

    <!-- 右侧画布 -->
    <div class="canvas-container" id="canvas">
      <div class="loader" id="loader">
        <div class="spinner"></div>
        <div>渲染图表中...</div>
      </div>
      <div id="diagram-wrapper">
        <div class="mermaid" id="mermaid-renderer">
          <!-- 动态渲染内容 -->
        </div>
      </div>
      <div class="zoom-badge" id="zoom-badge">缩放: 100%</div>
    </div>
  </div>

  <script>
    // 定义三个图表的 Mermaid 源码
    const DIAGRAMS = {
      'core-chen': `flowchart TB
    %% 实体与属性的 subgraph 分组，防止属性散乱拥挤
    subgraph user_group["用户实体 sys_user"]
        user[用户 sys_user]
        user_id([id])
        user_name([username])
        user_role([role])
        user --- user_id
        user --- user_name
        user --- user_role
    end

    subgraph resource_group["实验室资源实体 resource"]
        resource[实验室资源 resource]
        resource_id([id])
        resource_code([resource_code])
        resource_name([resource_name])
        resource_status([status])
        resource --- resource_id
        resource --- resource_code
        resource --- resource_name
        resource --- resource_status
    end

    subgraph slot_group["预约时段实体 resource_slot"]
        slot[预约时段 resource_slot]
        slot_id([id])
        slot_time([start_datetime / end_datetime])
        slot_type([slot_type])
        slot_quota([total_quota / remain_quota])
        slot_status([status])
        slot --- slot_id
        slot --- slot_time
        slot --- slot_type
        slot --- slot_quota
        slot --- slot_status
    end

    subgraph request_group["热门预约请求实体 reservation_request"]
        request[热门预约请求 request]
        request_id([id])
        request_no([request_no])
        request_active_key([active_key])
        request_status([status])
        request_dispatch([dispatch_status])
        request_reservation_id([reservation_id])
        request --- request_id
        request --- request_no
        request --- request_active_key
        request --- request_status
        request --- request_dispatch
        request --- request_reservation_id
    end

    subgraph reservation_group["预约记录实体 reservation"]
        reservation[预约记录 reservation]
        reservation_id([id])
        reservation_no([reservation_no])
        reservation_status([status])
        reservation_active([is_active])
        reservation_checkin([checked_in_at])
        reservation_deadline([auto_cancel_deadline])
        reservation_source([source_type])
        reservation --- reservation_id
        reservation --- reservation_no
        reservation --- reservation_status
        reservation --- reservation_active
        reservation --- reservation_checkin
        reservation --- reservation_deadline
        reservation --- reservation_source
    end

    %% 关系菱形定义
    rel_user_request{提交}
    rel_user_reservation{创建}
    rel_resource_slot{包含}
    rel_slot_reservation{被预约}
    rel_request_reservation{成功生成}

    %% 实体与关系的连线 (1:N 关系在连线上标注)
    user -->|1| rel_user_request -->|N| request
    user -->|1| rel_user_reservation -->|N| reservation
    resource -->|1| rel_resource_slot -->|N| slot
    slot -->|N| rel_slot_reservation -->|1| reservation
    request -->|1| rel_request_reservation -->|0..1| reservation

    %% 自定义节点与连接线颜色
    classDef default fill:#1e293b,stroke:#475569,stroke-width:1.5px,color:#f8fafc;
    classDef entity fill:#1e3a8a,stroke:#3b82f6,stroke-width:2px,color:#f8fafc;
    classDef attribute fill:#0f172a,stroke:#475569,stroke-width:1px,color:#cbd5e1;
    classDef relation fill:#312e81,stroke:#6366f1,stroke-width:2px,color:#f8fafc;

    class user,resource,slot,request,reservation entity;
    class user_id,user_name,user_role,resource_id,resource_code,resource_name,resource_status,slot_id,slot_time,slot_type,slot_quota,slot_status,request_id,request_no,request_active_key,request_status,request_dispatch,request_reservation_id,reservation_id,reservation_no,reservation_status,reservation_active,reservation_checkin,reservation_deadline,reservation_source attribute;
    class rel_user_request,rel_user_reservation,rel_resource_slot,rel_slot_reservation,rel_request_reservation relation;
      `,

      'core-crows': `erDiagram
    sys_user ||--o{ reservation_request : "提交"
    sys_user ||--o{ reservation : "创建"
    resource ||--|{ resource_slot : "包含"
    resource_slot ||--o{ reservation : "被预约"
    reservation_request |o--o| reservation : "成功生成"

    sys_user {
        bigint id PK
        varchar username
        varchar role
    }

    resource {
        bigint id PK
        varchar resource_code
        varchar resource_name
        varchar status
    }

    resource_slot {
        bigint id PK
        datetime start_datetime
        datetime end_datetime
        varchar slot_type
        int total_quota
        int remain_quota
        varchar status
    }

    reservation_request {
        bigint id PK
        varchar request_no
        varchar active_key
        varchar status
        varchar dispatch_status
        bigint reservation_id FK
    }

    reservation {
        bigint id PK
        varchar reservation_no
        varchar status
        boolean is_active
        datetime checked_in_at
        datetime auto_cancel_deadline
        varchar source_type
    }
      `,

      'full-crows': `erDiagram
    sys_user ||--o{ reservation_request : "提交"
    sys_user ||--o{ reservation : "创建"
    resource ||--|{ resource_slot : "包含"
    resource_slot ||--o{ reservation : "被预约"
    reservation_request |o--o| reservation : "成功生成"
    reservation ||--o{ reservation_reminder_task : "生成提醒任务"
    reservation_request ||--o{ message_outbox : "写超时延迟消息"
    reservation_reminder_task ||--o{ message_outbox : "写提醒延迟消息"
    reservation ||--o{ message_outbox : "写取消延迟消息"
    reservation_reminder_task ||--o{ user_notification : "产生提醒通知"
    reservation ||--o{ user_notification : "产生取消通知"

    sys_user {
        bigint id PK
        varchar username
        varchar role
    }
    resource {
        bigint id PK
        varchar resource_code
        varchar resource_name
        varchar status
    }
    resource_slot {
        bigint id PK
        datetime start_datetime
        datetime end_datetime
        varchar slot_type
        int total_quota
        int remain_quota
        varchar status
    }
    reservation_request {
        bigint id PK
        varchar request_no
        varchar active_key
        varchar status
        varchar dispatch_status
        bigint reservation_id FK
    }
    reservation {
        bigint id PK
        varchar reservation_no
        varchar status
        boolean is_active
        datetime checked_in_at
        datetime auto_cancel_deadline
        varchar source_type
    }
    reservation_reminder_task {
        bigint id PK
        varchar remind_type
        datetime plan_send_time
        varchar status
    }
    message_outbox {
        bigint id PK
        varchar event_id
        varchar aggregate_type
        bigint aggregate_id
        varchar event_type
        datetime available_at
        varchar status
        varchar tag
    }
    user_notification {
        bigint id PK
        varchar type
        boolean is_read
        bigint related_reservation_id FK
        bigint reminder_task_id FK
    }
      `
    };

    // 初始化 Mermaid 配置
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        background: '#0b0f19',
        primaryColor: '#1e3a8a',
        primaryTextColor: '#f8fafc',
        lineColor: '#38bdf8',
        secondaryColor: '#312e81'
      },
      flowchart: {
        useMaxWidth: false,
        htmlLabels: true
      },
      er: {
        useMaxWidth: false
      }
    });

    let currentTab = 'core-chen';
    const canvas = document.getElementById('canvas');
    const wrapper = document.getElementById('diagram-wrapper');
    const renderer = document.getElementById('mermaid-renderer');
    const loader = document.getElementById('loader');
    const zoomBadge = document.getElementById('zoom-badge');

    // 平移与缩放状态
    let scale = 1.0;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX, startY;

    // 渲染图表
    async function renderDiagram(key) {
      loader.style.display = 'flex';
      renderer.classList.remove('ready');
      renderer.removeAttribute('data-processed');
      renderer.innerHTML = DIAGRAMS[key];

      try {
        await mermaid.run({
          nodes: [renderer]
        });
        renderer.classList.add('ready');
        resetZoom();
      } catch (err) {
        console.error('Mermaid render error:', err);
        renderer.innerHTML = `<p style="color:#ef4444;padding:20px;">图表渲染失败: ${err.message}</p>`;
      } finally {
        loader.style.display = 'none';
      }
    }

    // 切换 Tab
    function switchTab(tabKey) {
      if (currentTab === tabKey) return;
      currentTab = tabKey;
      
      // 更新 Tab 按钮激活状态
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => 
        btn.getAttribute('onclick').includes(tabKey)
      );
      if (activeBtn) activeBtn.classList.add('active');

      renderDiagram(tabKey);
    }

    // 更新平移与缩放变换
    function updateTransform() {
      wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      zoomBadge.textContent = `缩放: ${Math.round(scale * 100)}%`;
    }

    // 缩放控制
    function zoomIn() {
      scale = Math.min(3.0, scale * 1.15);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(0.15, scale / 1.15);
      updateTransform();
    }

    function resetZoom() {
      scale = 0.85; // 稍微缩小一点以展示全貌
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    // 滚轮缩放
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.08;
      
      // 记录鼠标相对 wrapper 的位置以进行中心缩放
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const oldScale = scale;
      if (e.deltaY < 0) {
        scale = Math.min(3.0, scale * zoomFactor);
      } else {
        scale = Math.max(0.15, scale / zoomFactor);
      }

      // 调整平移量，实现以鼠标指针为中心缩放
      translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
      translateY = mouseY - (mouseY - translateY) * (scale / oldScale);

      updateTransform();
    });

    // 拖拽平移
    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // 仅左键拖拽
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      canvas.style.cursor = 'grabbing';
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        canvas.style.cursor = 'grab';
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    // 导出 SVG 格式
    function exportSVG() {
      const svgElement = renderer.querySelector('svg');
      if (!svgElement) return;

      const svgClone = svgElement.cloneNode(true);
      // 清除缩放，保持导出文件的干净
      svgClone.removeAttribute('style');
      
      const svgString = new XMLSerializer().serializeToString(svgClone);
      const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const downloadLink = document.createElement('a');
      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = `er-diagram-${currentTab}.svg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    // 导出高清大图 PNG (以 3000px 宽度导出，保证放大不模糊)
    function exportPNG() {
      const svgElement = renderer.querySelector('svg');
      if (!svgElement) return;

      const svgClone = svgElement.cloneNode(true);
      svgClone.removeAttribute('style');

      // 提取原始尺寸
      let originWidth = svgElement.viewBox.baseVal.width || svgElement.width.baseVal.value || 1200;
      let originHeight = svgElement.viewBox.baseVal.height || svgElement.height.baseVal.value || 800;

      // 设置 3x 超清分辨率输出
      const targetWidth = originWidth * 3;
      const targetHeight = originHeight * 3;

      svgClone.setAttribute('width', targetWidth);
      svgClone.setAttribute('height', targetHeight);

      // 如果没有 viewbox，补充一个
      if (!svgClone.getAttribute('viewBox')) {
        svgClone.setAttribute('viewBox', `0 0 ${originWidth} ${originHeight}`);
      }

      // 将内联 SVG 转为 data URI
      const svgString = new XMLSerializer().serializeToString(svgClone);
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const blobURL = URL.createObjectURL(svgBlob);

      const image = new Image();
      image.onload = () => {
        // 创建 Canvas 渲染
        const canvasElement = document.createElement('canvas');
        canvasElement.width = targetWidth;
        canvasElement.height = targetHeight;
        const ctx = canvasElement.getContext('2d');

        // 填充深色背景（与查看器主题一致，效果更好）
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, targetWidth, targetHeight);

        // 绘制图像
        ctx.drawImage(image, 0, 0, targetWidth, targetHeight);

        // 触发下载
        const pngURL = canvasElement.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngURL;
        downloadLink.download = `er-diagram-${currentTab}-highres.png`;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobURL);
      };
      image.src = blobURL;
    }

    // 首次渲染
    window.addEventListener('DOMContentLoaded', () => {
      renderDiagram(currentTab);
    });
  </script>
</body>
</html>
