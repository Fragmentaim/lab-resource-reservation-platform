<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预约链路 E-R 图编辑器</title>
  <style>
    :root {
      color-scheme: light;
      --border: #d7dce2;
      --text: #151515;
      --muted: #5f6875;
      --bg: #f5f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }

    button {
      height: 34px;
      padding: 0 13px;
      border: 1px solid #1d1d1d;
      background: #fff;
      color: #111;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    button.primary {
      background: #111;
      color: #fff;
    }

    button:hover {
      background: #f1f3f5;
    }

    button.primary:hover {
      background: #2c2c2c;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 160px;
      accent-color: #111;
    }

    .hint {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .stage {
      overflow: auto;
      height: calc(100vh - 59px);
      padding: 28px;
    }

    .canvas-wrap {
      width: max-content;
      height: max-content;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      transform-origin: top left;
    }

    svg {
      display: block;
      background: #fff;
      user-select: none;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" id="exportPng">导出 PNG</button>
    <button id="exportSvg">导出 SVG</button>
    <button id="reset">重置布局</button>
    <label>
      缩放
      <input id="zoom" type="range" min="0.2" max="1.2" step="0.05" value="0.35">
      <span id="zoomText">35%</span>
    </label>
    <span class="hint">拖动矩形、椭圆、菱形调整位置，布局会自动保存</span>
  </div>

  <div class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <svg id="erSvg" xmlns="http://www.w3.org/2000/svg" width="5200" height="3600" viewBox="0 0 5200 3600"></svg>
    </div>
  </div>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const VIEW_W = 5200;
    const VIEW_H = 3600;
    const EXPORT_SCALE = 1;
    const STORAGE_KEY = "lab-reservation-er-layout-v9";

    const defaultNodes = {
      user: { type: "entity", x: 650, y: 1750, w: 300, h: 110, text: "用户" },
      reservation: { type: "entity", x: 1700, y: 1750, w: 300, h: 110, text: "预约" },
      slot: { type: "entity", x: 2750, y: 1750, w: 320, h: 110, text: "预约时段" },
      resource: { type: "entity", x: 3850, y: 1750, w: 320, h: 120, text: "资源" },
      resourceType: { type: "entity", x: 3850, y: 720, w: 320, h: 110, text: "资源类型" },

      create: { type: "relation", x: 1130, y: 1750, w: 210, h: 130, text: "创建" },
      occupy: { type: "relation", x: 2225, y: 1750, w: 210, h: 130, text: "占用" },
      provide: { type: "relation", x: 3300, y: 1750, w: 210, h: 130, text: "提供" },
      classify: { type: "relation", x: 3850, y: 1220, w: 210, h: 130, text: "归类" },

      userId: { type: "attribute", x: 430, y: 1380, rx: 160, ry: 58, text: "用户编号", key: true },
      username: { type: "attribute", x: 290, y: 2070, rx: 145, ry: 58, text: "用户名" },
      phone: { type: "attribute", x: 700, y: 2230, rx: 120, ry: 58, text: "手机号" },
      role: { type: "attribute", x: 1000, y: 2070, rx: 120, ry: 58, text: "角色" },

      reservationNo: { type: "attribute", x: 1400, y: 1380, rx: 155, ry: 58, text: "预约编号", key: true },
      reserveCreatedAt: { type: "attribute", x: 1700, y: 1240, rx: 165, ry: 58, text: "提交时间" },
      reservationStatus: { type: "attribute", x: 2000, y: 1380, rx: 155, ry: 58, text: "预约状态" },

      slotId: { type: "attribute", x: 2460, y: 1360, rx: 145, ry: 58, text: "时段编号", key: true },
      slotStartTime: { type: "attribute", x: 2900, y: 1260, rx: 145, ry: 58, text: "开始时间" },
      slotEndTime: { type: "attribute", x: 3180, y: 1440, rx: 145, ry: 58, text: "结束时间" },
      totalQuota: { type: "attribute", x: 2750, y: 2120, rx: 145, ry: 58, text: "总名额" },

      resourceCode: { type: "attribute", x: 3550, y: 1380, rx: 180, ry: 58, text: "资源编号", key: true },
      resourceName: { type: "attribute", x: 4200, y: 1380, rx: 155, ry: 58, text: "资源名称" },
      resourceLocation: { type: "attribute", x: 4200, y: 2120, rx: 155, ry: 58, text: "资源位置" },
      resourceStatus: { type: "attribute", x: 3550, y: 2120, rx: 145, ry: 58, text: "资源状态" },

      typeId: { type: "attribute", x: 3500, y: 420, rx: 160, ry: 58, text: "类型编号", key: true },
      typeName: { type: "attribute", x: 4200, y: 420, rx: 160, ry: 58, text: "类型名称" }
    };

    const edges = [
      { from: "user", to: "create", fromCard: "1" },
      { from: "create", to: "reservation", toCard: "N" },
      { from: "reservation", to: "occupy", fromCard: "N" },
      { from: "occupy", to: "slot", toCard: "1" },
      { from: "resource", to: "provide", fromCard: "1" },
      { from: "provide", to: "slot", toCard: "N" },
      { from: "resourceType", to: "classify", fromCard: "1" },
      { from: "classify", to: "resource", toCard: "N" },

      { from: "userId", to: "user" },
      { from: "username", to: "user" },
      { from: "phone", to: "user" },
      { from: "role", to: "user" },
      { from: "reservationNo", to: "reservation" },
      { from: "reserveCreatedAt", to: "reservation" },
      { from: "reservationStatus", to: "reservation" },
      { from: "slotId", to: "slot" },
      { from: "slotStartTime", to: "slot" },
      { from: "slotEndTime", to: "slot" },
      { from: "totalQuota", to: "slot" },
      { from: "resourceCode", to: "resource" },
      { from: "resourceName", to: "resource" },
      { from: "resourceLocation", to: "resource" },
      { from: "resourceStatus", to: "resource" },
      { from: "typeId", to: "resourceType" },
      { from: "typeName", to: "resourceType" }
    ];

    const svg = document.getElementById("erSvg");
    const canvasWrap = document.getElementById("canvasWrap");
    const zoomInput = document.getElementById("zoom");
    const zoomText = document.getElementById("zoomText");
    let nodes = loadLayout();
    let dragging = null;

    function loadLayout() {
      const copy = structuredClone(defaultNodes);
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        for (const [id, point] of Object.entries(saved)) {
          if (copy[id] && Number.isFinite(point.x) && Number.isFinite(point.y)) {
            copy[id].x = point.x;
            copy[id].y = point.y;
          }
        }
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
      return copy;
    }

    function saveLayout() {
      const saved = {};
      for (const [id, node] of Object.entries(nodes)) {
        saved[id] = { x: Math.round(node.x), y: Math.round(node.y) };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    }

    function el(name, attrs = {}) {
      const node = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attrs)) {
        node.setAttribute(key, value);
      }
      return node;
    }

    function center(node) {
      return { x: node.x, y: node.y };
    }

    function applyZoom() {
      const zoom = Number(zoomInput.value);
      svg.style.width = `${VIEW_W * zoom}px`;
      svg.style.height = `${VIEW_H * zoom}px`;
      zoomText.textContent = `${Math.round(zoom * 100)}%`;
    }

    function styleTag() {
      const style = el("style");
      style.textContent = `
        .er-line { stroke: #111; stroke-width: 3.4; fill: none; }
        .er-entity, .er-attribute, .er-relation { fill: #fff; stroke: #111; stroke-width: 3.4; }
        .er-text { font-family: SimSun, "Microsoft YaHei", sans-serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
        .er-entity-text { font-size: 46px; }
        .er-relation-text { font-size: 40px; }
        .er-attr-text { font-size: 35px; }
        .er-key { text-decoration: underline; }
        .er-card-bg { fill: #fff; stroke: #111; stroke-width: 2.4; }
        .er-card { font-family: "Times New Roman", serif; font-size: 54px; font-weight: 700; fill: #111; text-anchor: middle; dominant-baseline: middle; }
        .draggable { cursor: move; }
      `;
      return style;
    }

    function render() {
      svg.replaceChildren();
      svg.appendChild(styleTag());
      svg.appendChild(el("rect", { x: 0, y: 0, width: VIEW_W, height: VIEW_H, fill: "#fff" }));

      const lines = el("g");
      for (const edge of edges) {
        const a = nodes[edge.from];
        const b = nodes[edge.to];
        const p1 = center(a);
        const p2 = center(b);
        lines.appendChild(el("line", {
          class: "er-line",
          x1: p1.x,
          y1: p1.y,
          x2: p2.x,
          y2: p2.y
        }));
        addCardinality(lines, edge.fromCard || edge.toCard, p1, p2);
      }
      svg.appendChild(lines);

      const nodeLayer = el("g");
      for (const [id, node] of Object.entries(nodes)) {
        nodeLayer.appendChild(renderNode(id, node));
      }
      svg.appendChild(nodeLayer);
    }

    function addCardinality(parent, label, p1, p2) {
      if (!label) return;
      const t = 0.5;
      const x = p1.x + (p2.x - p1.x) * t;
      const y = p1.y + (p2.y - p1.y) * t;
      const group = el("g");
      const width = label.length <= 1 ? 70 : label.length * 30 + 36;
      const height = 62;
      group.appendChild(el("rect", {
        class: "er-card-bg",
        x: x - width / 2,
        y: y - height / 2,
        width,
        height,
        rx: 8,
        ry: 8
      }));
      const text = el("text", { class: "er-card", x, y: y + 1 });
      text.textContent = label;
      group.appendChild(text);
      parent.appendChild(group);
    }

    function renderNode(id, node) {
      const group = el("g", { class: "draggable", "data-id": id });
      if (node.type === "entity") {
        group.appendChild(el("rect", {
          class: "er-entity",
          x: node.x - node.w / 2,
          y: node.y - node.h / 2,
          width: node.w,
          height: node.h
        }));
        group.appendChild(textNode(node.text, node.x, node.y, "er-entity-text"));
      }
      if (node.type === "relation") {
        const hw = node.w / 2;
        const hh = node.h / 2;
        group.appendChild(el("polygon", {
          class: "er-relation",
          points: `${node.x},${node.y - hh} ${node.x + hw},${node.y} ${node.x},${node.y + hh} ${node.x - hw},${node.y}`
        }));
        group.appendChild(textNode(node.text, node.x, node.y, "er-relation-text"));
      }
      if (node.type === "attribute") {
        group.appendChild(el("ellipse", {
          class: "er-attribute",
          cx: node.x,
          cy: node.y,
          rx: node.rx,
          ry: node.ry
        }));
        group.appendChild(textNode(node.text, node.x, node.y, `er-attr-text${node.key ? " er-key" : ""}`));
      }
      group.addEventListener("pointerdown", startDrag);
      return group;
    }

    function textNode(value, x, y, className) {
      const text = el("text", { class: `er-text ${className}`, x, y });
      text.textContent = value;
      return text;
    }

    function svgPoint(event) {
      const point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      return point.matrixTransform(svg.getScreenCTM().inverse());
    }

    function startDrag(event) {
      const id = event.currentTarget.dataset.id;
      const p = svgPoint(event);
      dragging = {
        id,
        dx: p.x - nodes[id].x,
        dy: p.y - nodes[id].y
      };
      event.currentTarget.setPointerCapture(event.pointerId);
    }

    svg.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const p = svgPoint(event);
      nodes[dragging.id].x = clamp(p.x - dragging.dx, 50, VIEW_W - 50);
      nodes[dragging.id].y = clamp(p.y - dragging.dy, 50, VIEW_H - 50);
      render();
    });

    svg.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = null;
      saveLayout();
    });

    svg.addEventListener("pointerleave", () => {
      if (!dragging) return;
      dragging = null;
      saveLayout();
    });

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resetLayout() {
      localStorage.removeItem(STORAGE_KEY);
      nodes = structuredClone(defaultNodes);
      render();
    }

    async function exportPng() {
      const clone = svg.cloneNode(true);
      clone.setAttribute("width", VIEW_W * EXPORT_SCALE);
      clone.setAttribute("height", VIEW_H * EXPORT_SCALE);
      clone.setAttribute("viewBox", `0 0 ${VIEW_W} ${VIEW_H}`);
      const svgText = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      try {
        const image = await loadImage(url);
        const canvas = document.createElement("canvas");
        canvas.width = VIEW_W * EXPORT_SCALE;
        canvas.height = VIEW_H * EXPORT_SCALE;
        const context = canvas.getContext("2d");
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        downloadUrl(canvas.toDataURL("image/png"), "reservation-er-diagram.png");
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function exportSvg() {
      const clone = svg.cloneNode(true);
      clone.setAttribute("width", VIEW_W);
      clone.setAttribute("height", VIEW_H);
      const svgText = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      downloadUrl(url, "reservation-er-diagram.svg");
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = url;
      });
    }

    function downloadUrl(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    document.getElementById("exportPng").addEventListener("click", exportPng);
    document.getElementById("exportSvg").addEventListener("click", exportSvg);
    document.getElementById("reset").addEventListener("click", resetLayout);
    zoomInput.addEventListener("input", applyZoom);

    render();
    applyZoom();
  </script>
</body>
</html>
