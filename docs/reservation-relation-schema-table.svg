<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700"><defs><style>
.bg { fill: #fff; }
.title { font-family: SimSun, "Microsoft YaHei", sans-serif; font-size: 54px; font-weight: 700; fill: #111; text-anchor: middle; }
