.arrow-label-bg { fill: #fff; stroke: #bbb; stroke-width: 1.2; }
.arrow-label { font-family: SimSun, "Microsoft YaHei", sans-serif; font-size: 23px; fill: #111; text-anchor: middle; }
.footer { font-family: SimSun, "Microsoft YaHei", sans-serif; font-size: 26px; fill: #333; }
